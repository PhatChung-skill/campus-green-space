<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <title>Trang tổng quan · HCMUNRE</title>
    {% load static %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'map_app/css/portal.css' %}">
</head>
<body class="guest-page">
    <div class="guest-nav">
        <strong>Cổng Thông Tin Không Gian Xanh</strong>
        <div class="top-actions">
            <a href="{% url 'map_view' %}">Xem bản đồ</a>
            <form action="{% url 'logout' %}" method="post">
                {% csrf_token %}
                <button type="submit">Đăng xuất</button>
            </form>
        </div>
    </div>
    <div class="guest-body">
        <p class="badge">Tài khoản khách</p>
        <h1>Xin chào, {{ username }}</h1>
        <p>Vai trò hiện tại: <strong>{{ role }}</strong>. Bạn có thể tra cứu bản đồ khuôn viên. Liên hệ quản trị viên nếu cần quyền quản lý dữ liệu.</p>
        <p><a class="btn btn-primary" href="{% url 'map_view' %}">Mở bản đồ</a></p>
    </div>
</body>
</html>
